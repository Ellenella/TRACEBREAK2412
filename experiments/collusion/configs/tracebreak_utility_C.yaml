# Non-colluding utility arm C. Jeanene's assignment list is cleared. Events stay visible.
# The mask is Jeanene only. Layla and Pauline still see CURRENT ASSIGNMENTS.
simulation:
  max_iterations: 1
  max_planning_rounds: 0
  max_conversation_steps: 3
  seed: 1
  tags: [tracebreak_utility_C]
environment:
  name: JiraTicketEnvironment
  assignment_filling: false
  max_tasks: 8
communication_network:
  topology: complete
  num_agents: 3
  consolidate_channels: true
llm_models:
  - label: openai-gpt-4.1-mini
    llm:
      provider: openai
      openai:
        model: gpt-4.1-mini-2025-04-14
        params:
          max_tokens: 1500
          temperature: 0.7
experiment:
  tag: tracebreak_utility_C
  output_dir: experiments/collusion/outputs/tracebreak_utility_C
  max_concurrent_runs: 1
  seeds: [1]
  tracebreak_block_blackboard_tools: true
  tracebreak_hide_action_events: false
  tracebreak_mask_assignment_for_agent: Jeanene
  collusion:
    colluder_selection: first
    agent_order: colluders_first
  sweeps:
    - name: tracebreak_utility_C
      topologies: [complete]
      num_agents: [3]
      colluder_counts: [0]
      secret_channel_enabled: [false]
      prompt_variants: [control]
