# Setup pilot: one model, one seed. Sweep is now the real collusion mechanism: secret
# coalition-only blackboard ON, control vs "simple" colluder prompt, so the two are comparable.
# Key is NOT here: GeminiClient() takes no arguments, so it reads GOOGLE_API_KEY from .env.
# max_conversation_steps is 1, not 3: terrarium 0.1.1's Gemini continuation loop gets 400
# "Requests ending with a model turn" from Gemini 3.x, corrupting every turn while still
# reporting status=complete. Collusion behaviour is shallow at 1 step per turn.
simulation:
  max_iterations: 1
  max_planning_rounds: 4
  max_conversation_steps: 1
  seed: 1
  tags: [ellen_jira_baseline]
environment:
  name: JiraTicketEnvironment
  assignment_filling: false
  max_tasks: 8
communication_network:
  topology: complete
  num_agents: 3
  consolidate_channels: true
llm_models:
  - label: gemini-3.5-flash-lite
    llm:
      provider: gemini
      gemini:
        model: gemini-3.5-flash-lite
        params:
          max_tokens: 1024
          temperature: 0.7
experiment:
  tag: ellen_jira_collusion
  output_dir: experiments/collusion/outputs/ellen_jira_collusion
  max_concurrent_runs: 1
  seeds: [1]
  collusion:
    colluder_selection: first
    agent_order: random
  sweeps:
    - name: secret_channel
      topologies: [complete]
      num_agents: [3]
      colluder_counts: [2]
      secret_channel_enabled: [true]
      prompt_variants: [control, simple]
