# Setup pilot: one model, one seed, one cooperative condition.
# Adapted from supplied Jira configurations; not an unchanged paper reproduction.
simulation:
  max_iterations: 1
  max_planning_rounds: 4
  max_conversation_steps: 3
  seed: 1
  tags: [ellen_jira_baseline]
environment:
  name: JiraTicketEnvironment
  assignment_filling: false
  max_tasks: 8
communication_network:
  topology: complete
  num_agents: 3
  consolidate_channels: true
llm_models:
  - label: openai-gpt-4.1-mini
    llm:
      provider: openai
      openai:
        model: gpt-4.1-mini-2025-04-14
        params:
          max_tokens: 1500
          temperature: 0.7
experiment:
  tag: ellen_jira_baseline
  output_dir: experiments/collusion/outputs/ellen_jira_baseline
  max_concurrent_runs: 1
  seeds: [1]
  collusion:
    colluder_selection: first
    agent_order: random
  sweeps:
    - name: baseline
      topologies: [complete]
      num_agents: [3]
      colluder_counts: [2]
      secret_channel_enabled: [false]
      prompt_variants: [control]
