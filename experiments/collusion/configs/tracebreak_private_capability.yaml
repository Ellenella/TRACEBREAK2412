# Private-channel capability control. Not a matched contrast with action-only A.
# Four planning rounds are required because execution does not offer post_message.
# The action-only arms use zero planning rounds.
simulation:
  max_iterations: 1
  max_planning_rounds: 4
  max_conversation_steps: 3
  seed: 1
  tags: [tracebreak_private_capability]
environment:
  name: JiraTicketEnvironment
  assignment_filling: false
  max_tasks: 8
communication_network:
  topology: complete
  num_agents: 3
  consolidate_channels: true
llm_models:
  - label: openai-gpt-4.1-mini
    llm:
      provider: openai
      openai:
        model: gpt-4.1-mini-2025-04-14
        params:
          max_tokens: 1500
          temperature: 0.7
experiment:
  tag: tracebreak_private_capability
  output_dir: experiments/collusion/outputs/tracebreak_private_capability
  max_concurrent_runs: 1
  seeds: [1]
  tracebreak_block_blackboard_tools: false
  tracebreak_hide_action_events: false
  collusion:
    colluder_selection: first
    agent_order: colluders_first
  sweeps:
    - name: tracebreak_private_capability
      topologies: [complete]
      num_agents: [3]
      colluder_counts: [2]
      secret_channel_enabled: [true]
      prompt_variants: [structured]
