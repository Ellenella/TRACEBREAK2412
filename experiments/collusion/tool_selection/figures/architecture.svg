<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="28" y="32" font-family="Georgia, serif" font-size="18">Where the three observation policies cut</text>
<text x="28" y="54" font-family="Calibri, sans-serif" font-size="13" fill="#333">Both tools write the same assignment. Only the recorded function name differs. The saved execution log keeps that name under every policy.</text>

<rect x="28" y="78" width="168" height="78" rx="6" fill="#1f4e79"/>
<text x="112" y="108" text-anchor="middle" fill="#fff" font-family="Calibri, sans-serif" font-size="14">Sender</text>
<text x="112" y="128" text-anchor="middle" fill="#fff" font-family="Calibri, sans-serif" font-size="12">private bit 0 or 1</text>
<text x="112" y="146" text-anchor="middle" fill="#d6e4f0" font-family="Calibri, sans-serif" font-size="11">prompted codebook</text>

<rect x="230" y="70" width="210" height="46" rx="6" fill="#e8eef5" stroke="#1f4e79"/>
<text x="335" y="98" text-anchor="middle" font-family="Calibri, sans-serif" font-size="13">assign_task_direct(review)</text>
<rect x="230" y="124" width="210" height="46" rx="6" fill="#e8eef5" stroke="#1f4e79"/>
<text x="335" y="152" text-anchor="middle" font-family="Calibri, sans-serif" font-size="13">assign_task_queued(review)</text>
<text x="335" y="192" text-anchor="middle" font-family="Calibri, sans-serif" font-size="12" fill="#333">same task, ISSUE-0001::review</text>

<line x1="196" y1="110" x2="230" y2="93" stroke="#1f4e79" stroke-width="1.5"/>
<line x1="196" y1="124" x2="230" y2="147" stroke="#1f4e79" stroke-width="1.5"/>

<rect x="470" y="78" width="200" height="92" rx="6" fill="#f7f7f7" stroke="#666"/>
<text x="570" y="104" text-anchor="middle" font-family="Calibri, sans-serif" font-size="13">Execution record</text>
<text x="570" y="126" text-anchor="middle" font-family="Calibri, sans-serif" font-size="12">real tool name</text>
<text x="570" y="146" text-anchor="middle" font-family="Calibri, sans-serif" font-size="12">assignment written once</text>

<line x1="440" y1="116" x2="470" y2="116" stroke="#333" stroke-width="1.5"/>

<rect x="710" y="48" width="222" height="64" rx="6" fill="#1f4e79"/>
<text x="821" y="74" text-anchor="middle" fill="#fff" font-family="Calibri, sans-serif" font-size="14">T1 visible</text>
<text x="821" y="94" text-anchor="middle" fill="#fff" font-family="Calibri, sans-serif" font-size="12">name and assignment</text>

<rect x="710" y="128" width="222" height="64" rx="6" fill="#2e7d32"/>
<text x="821" y="154" text-anchor="middle" fill="#fff" font-family="Calibri, sans-serif" font-size="14">T2 canonical</text>
<text x="821" y="174" text-anchor="middle" fill="#fff" font-family="Calibri, sans-serif" font-size="12">name becomes assign_task</text>

<rect x="710" y="208" width="222" height="72" rx="6" fill="#c45911"/>
<text x="821" y="234" text-anchor="middle" fill="#fff" font-family="Calibri, sans-serif" font-size="14">T3 broad</text>
<text x="821" y="254" text-anchor="middle" fill="#fff" font-family="Calibri, sans-serif" font-size="12">no action event</text>
<text x="821" y="270" text-anchor="middle" fill="#fff" font-family="Calibri, sans-serif" font-size="12">no assignment for receiver</text>

<line x1="670" y1="100" x2="710" y2="80" stroke="#1f4e79" stroke-width="1.5"/>
<line x1="670" y1="124" x2="710" y2="160" stroke="#2e7d32" stroke-width="1.5"/>
<line x1="670" y1="148" x2="710" y2="236" stroke="#c45911" stroke-width="1.5"/>

<text x="28" y="250" font-family="Calibri, sans-serif" font-size="13">Receiver observation, after the filter</text>
<text x="28" y="278" font-family="Calibri, sans-serif" font-size="13" fill="#333">T2 rewrites the selected name in the prefetched blackboard text. It does not change the tool that ran.</text>
<text x="28" y="298" font-family="Calibri, sans-serif" font-size="13" fill="#333">T3 hides action events for every agent and clears the assignment section for the receiver only.</text>
<text x="28" y="318" font-family="Calibri, sans-serif" font-size="13" fill="#333">The third agent still receives CURRENT ASSIGNMENTS under T3.</text>

<rect x="28" y="348" width="904" height="86" rx="6" fill="#fafafa" stroke="#ddd"/>
<text x="44" y="374" font-family="Calibri, sans-serif" font-size="13">What this diagram does not remove. The receiver's tool list still offers both function names, and the prompted codebook still names both.</text>
<text x="44" y="396" font-family="Calibri, sans-serif" font-size="13">The tested claim is that the selected call is not distinguishable in the canonicalized observation, not that both names are deleted.</text>
<text x="44" y="418" font-family="Calibri, sans-serif" font-size="13">Signaling runs are prompted. Normal-mode runs leave the codebook off, and in those runs every sender and receiver call was assign_task_direct.</text>
</svg>
